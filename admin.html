<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC Calc - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/index.css">
    <link rel="stylesheet" href="./styles/admin.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
</head>
<body class="admin-body">
    
    <!-- Auth View -->
    <div id="auth-view" class="auth-container">
        <div class="glass-panel auth-panel">
            <div class="auth-header">
                <div class="auth-logo">MC Calc Admin</div>
                <p>Sign in to manage card designs</p>
            </div>
            
            <div class="input-group">
                <label class="input-label">Email Address</label>
                <input type="email" id="admin-email" class="text-input auth-input" placeholder="admin@example.com" autocomplete="email">
            </div>
            <div class="input-group">
                <label class="input-label">Password</label>
                <input type="password" id="admin-pass" class="text-input auth-input" placeholder="••••••••" autocomplete="current-password">
            </div>
            
            <button id="login-btn" class="btn-primary auth-btn">Access Dashboard</button>
            <div id="auth-error" class="error-box hidden"></div>
            
            <a href="index.html" class="back-link">← Back to Calculator</a>
        </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboard-view" class="dashboard-layout hidden">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-brand">MC Calc Admin</div>
            <nav class="sidebar-nav">
                <button class="nav-item active">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    Design Gallery
                </button>
            </nav>
            <div class="sidebar-footer">
                <button id="logout-btn" class="btn-logout">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-content">
            <header class="content-header">
                <div>
                    <h1>Card Design Gallery</h1>
                    <p class="text-muted">Manage built-in and custom templates.</p>
                </div>
                <div class="header-actions">
                    <a href="index.html" class="btn-secondary" target="_blank">Open App</a>
                    <button id="create-design-btn" class="btn-primary">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        New Design
                    </button>
                </div>
            </header>
            
            <!-- Gallery Grid -->
            <div id="designs-grid" class="designs-grid">
                <!-- Designs will be injected here by admin.js -->
            </div>
        </main>
    </div>

    <!-- Editor Modal -->
    <div class="modal-overlay hidden" id="editor-modal">
        <div class="modal-content admin-editor-modal">
            <div class="modal-header">
                <div>
                    <h2 class="modal-title" id="editor-title">Edit Design</h2>
                    <p class="text-muted" style="margin-top: 4px; font-size: 13px;" id="editor-subtitle">ID: theme_id</p>
                </div>
                <button class="close-btn" id="close-editor"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path fill-rule="evenodd" d="M5.47 5.47a.75.75 0 011.06 0L12 10.94l5.47-5.47a.75.75 0 111.06 1.06L13.06 12l5.47 5.47a.75.75 0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 010-1.06z" clip-rule="evenodd" /></svg></button>
            </div>
            
            <div class="editor-layout">
                <div class="editor-form">
                    <input type="hidden" id="edit-id">
                    
                    <div class="form-section">
                        <h3>General Settings</h3>
                        <div class="input-group">
                            <label>Design Name</label>
                            <input type="text" id="edit-name" class="text-input">
                        </div>

                        <div class="form-row">
                            <label class="dca-toggle-label">
                                <span class="dca-toggle-text">Active (Public)</span>
                                <input type="checkbox" id="edit-active" class="dca-chk">
                                <span class="toggle-switch-mini"></span>
                            </label>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>Theme Logic (Advanced)</h3>
                        <div class="input-group">
                            <label>Palettes (JSON Array)</label>
                            <textarea id="edit-palettes" class="code-input" rows="4">[{}]</textarea>
                        </div>
                        <div class="input-group">
                            <label>Typography (JSON Object)</label>
                            <textarea id="edit-typography" class="code-input" rows="3">{}</textarea>
                        </div>
                        <div class="input-group">
                            <label>renderBackground(pal, tierId, variant) { ... }</label>
                            <textarea id="edit-bg" class="code-input" rows="6">return '';</textarea>
                        </div>
                        <div class="input-group">
                            <label>renderEffects(pal, tierId, detailIdx) { ... }</label>
                            <textarea id="edit-fx" class="code-input" rows="3">return '';</textarea>
                        </div>
                        <div class="input-group">
                            <label>getBorder(pal) { ... }</label>
                            <textarea id="edit-border" class="code-input" rows="2">return '';</textarea>
                        </div>
                        <div class="input-group">
                            <label>renderLayout({ cd, pal, typo, W, H, S }) { ... }</label>
                            <textarea id="edit-layout" class="code-input" rows="10">return '';</textarea>
                        </div>
                    </div>
                    
                    <div class="editor-actions">
                        <button id="save-design-btn" class="btn-primary w-full">Save Changes</button>
                        <button id="delete-design-btn" class="btn-danger w-full hidden" style="margin-top: 10px;">Delete Custom Theme</button>
                        <p id="delete-hint" class="text-muted" style="font-size: 11px; margin-top: 8px; text-align: center; display: none;">Deleting a built-in theme override restores the original.</p>
                    </div>
                </div>
                
                <div class="editor-preview">
                    <div class="preview-header">
                        <h3>Live Preview</h3>
                        <button id="refresh-preview-btn" class="icon-btn" title="Refresh Preview">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                        </button>
                    </div>
                    <div class="preview-wrapper">
                        <div id="preview-container">
                            <div id="card-node" class="card-node"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden Render Node for Gallery Thumbnails -->
    <div id="hidden-thumbnail-renderer" style="position:absolute; top:-9999px; left:-9999px; width:0; height:0; overflow:hidden;"></div>

    <script type="module" src="./scripts/admin.js"></script>
</body>
</html>
