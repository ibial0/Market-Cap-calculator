<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)" />
  <!-- Hexagon outline -->
  <path d="M256 80 L408 168 L408 344 L256 432 L104 344 L104 168 Z" fill="none" stroke="url(#accent)" stroke-width="24" stroke-linejoin="round" filter="url(#glow)" />
  <!-- Inner Chart / Coin elements -->
  <circle cx="256" cy="256" r="80" fill="url(#accent)" filter="url(#glow)" opacity="0.8"/>
  <path d="M180 280 L220 220 L270 260 L330 180" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
