<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MC Calc - Crypto PnL</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@500;700;900&family=Space+Grotesk:wght@600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>

    <style>
        :root {
            --bg-primary: #0a0f1c;
            --bg-secondary: #131b2f;
            --bg-glass: rgba(19, 27, 47, 0.7);
            --text-primary: #ffffff;
            --text-secondary: #8b98b4;
            --accent-primary: #00f2fe;
            --accent-secondary: #4facfe;
            --success: #00ff88;
            --danger: #ff4b4b;
            --border: rgba(255, 255, 255, 0.08);
            
            --font-ui: 'Inter', sans-serif;
            --font-mono: 'Roboto Mono', monospace;
            --font-display: 'Outfit', sans-serif;
        }

        [data-theme="light"] {
            --bg-primary: #f4f7f9;
            --bg-secondary: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.8);
            --text-primary: #0a0f1c;
            --text-secondary: #5c6b89;
            --accent-primary: #0284c7;
            --accent-secondary: #38bdf8;
            --success: #059669;
            --danger: #dc2626;
            --border: rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s ease, color 0.2s ease;
            overflow-x: hidden;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo svg { width: 32px; height: 32px; }

        .header-actions { display: flex; gap: 0.5rem; }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.2s ease;
        }
        
        .icon-btn:hover { background: var(--bg-secondary); }
        .icon-btn:active { transform: scale(0.9); }
        .icon-btn svg { width: 22px; height: 22px; fill: currentColor; }

        /* Main Container */
        main {
            flex: 1;
            padding: 1.5rem 1rem;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        /* Glass Panel */
        .glass-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        /* Inputs */
        .input-group { margin-bottom: 1.2rem; }
        .input-group:last-child { margin-bottom: 0; }

        .input-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 0.4rem;
            transition: border-color 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-primary);
        }

        .prefix {
            color: var(--text-secondary);
            padding-left: 0.75rem;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .amount-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.3rem;
            padding: 0.5rem 0.75rem;
            outline: none;
            width: 100%;
        }
        
        .amount-input::placeholder { color: var(--text-secondary); opacity: 0.3; }

        /* Multiplier Toggles */
        .multiplier-group {
            display: flex;
            gap: 0.25rem;
            padding-right: 0.25rem;
            background: var(--bg-secondary);
            border-radius: 10px;
            padding: 4px;
        }

        .mul-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.9rem;
            width: 38px; height: 34px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mul-btn.active {
            background: var(--accent-primary);
            color: #0a0f1c;
            box-shadow: 0 2px 10px rgba(0, 242, 254, 0.3);
        }

        /* Results Panel */
        .results-panel {
            background: linear-gradient(160deg, var(--bg-secondary), var(--bg-primary));
            border: 1px solid rgba(0, 242, 254, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        .results-panel::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
        }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .result-item.full-width { grid-column: 1 / -1; }

        .result-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.3rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .result-value {
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-primary);
        }
        
        .result-item.full-width .result-value {
            font-size: 2.5rem;
        }
        
        .result-sub {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
            font-weight: 500;
            font-family: var(--font-mono);
        }

        .value-green { color: var(--success) !important; }
        .value-red { color: var(--danger) !important; }

        /* Secondary Inputs (User info) */
        .meta-inputs {
            display: flex;
            gap: 1rem;
        }
        
        .meta-inputs .input-wrapper {
            padding: 0;
        }
        
        .meta-inputs .amount-input {
            font-family: var(--font-ui);
            font-weight: 500;
            font-size: 1rem;
            padding: 0.8rem 1rem;
        }

        /* Primary Button */
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: #0a0f1c; 
            border: none;
            border-radius: 16px;
            padding: 1.2rem;
            font-size: 1.1rem;
            font-weight: 800;
            font-family: var(--font-display);
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.6rem;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.25);
        }

        .btn-primary:active {
            transform: scale(0.97);
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.15);
        }

        /* Settings Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 15, 28, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 1.5rem;
            transform: translateY(20px) scale(0.95);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-family: var(--font-display);
            font-size: 1.3rem;
            font-weight: 800;
        }

        .close-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            width: 36px; height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s ease;
        }
        .close-btn:hover { background: rgba(255,255,255,0.1); }
        
        .toggle-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 0;
            border-bottom: 1px solid var(--border);
        }
        
        .toggle-label {
            font-weight: 600;
            font-size: 0.95rem;
        }
        
        /* Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px; height: 26px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            transition: .3s; border-radius: 26px;
        }
        .slider:before {
            position: absolute; content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: var(--text-secondary);
            transition: .3s; border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--accent-primary);
            border-color: var(--accent-primary);
        }
        input:checked + .slider:before {
            transform: translateX(24px);
            background-color: #0a0f1c;
        }
        
        /* Card Preview Modal */
        #preview-overlay .modal-content {
            max-width: 600px;
            background: var(--bg-primary);
            padding: 1rem;
            border-radius: 20px;
        }
        
        .preview-container {
            width: 100%;
            aspect-ratio: 16/9; /* Standard landscape */
            background: var(--bg-secondary);
            border-radius: 12px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            border: 1px solid var(--border);
        }
        
        .preview-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .preview-image.loaded { opacity: 1; }
        
        .loading-spinner {
            position: absolute;
            width: 40px; height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Hidden Render Node */
        #render-node-container {
            position: absolute;
            top: -9999px;
            left: -9999px;
            opacity: 0;
            pointer-events: none;
        }
        
        .card-node {
            width: 1600px;
            height: 900px;
            background: #0a0f1c;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                <circle cx="256" cy="256" r="256" fill="currentColor" opacity="0.1" />
                <path d="M256 80 L408 168 L408 344 L256 432 L104 344 L104 168 Z" fill="none" stroke="url(#logo-grad)" stroke-width="24" stroke-linejoin="round" />
                <circle cx="256" cy="256" r="80" fill="url(#logo-grad)"/>
                <path d="M180 280 L220 220 L270 260 L330 180" fill="none" stroke="var(--bg-primary)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
                <defs>
                    <linearGradient id="logo-grad" x1="0%" y1="100%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="var(--accent-primary)" />
                        <stop offset="100%" stop-color="var(--accent-secondary)" />
                    </linearGradient>
                </defs>
            </svg>
            MC Calc
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="theme-toggle" aria-label="Toggle Theme">
                <svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z" /></svg>
            </button>
            <button class="icon-btn" id="settings-btn" aria-label="Settings">
                <svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M11.078 2.25c-.917 0-1.699.663-1.85 1.567L9.05 4.889c-.02.12-.115.26-.297.348a7.493 7.493 0 00-.986.57c-.166.115-.334.126-.45.083L6.3 5.508a1.875 1.875 0 00-2.282.819l-.922 1.597a1.875 1.875 0 00.432 2.385l.84.692c.097.078.16.208.16.336 0 .013-.005.09-.006.183a8.1 8.1 0 000 1.996c.002.094.005.17.006.183.002.128-.063.258-.16.336l-.84.692a1.875 1.875 0 00-.432 2.385l.922 1.597a1.875 1.875 0 002.282.818l1.019-.382c.115-.043.283-.031.45.082.312.214.641.405.985.57.182.088.277.228.297.35l.178 1.071c.151.904.933 1.567 1.85 1.567h1.844c.916 0 1.699-.663 1.85-1.567l.178-1.072c.02-.12.114-.26.297-.349.344-.165.673-.356.985-.57.167-.114.335-.125.45-.082l1.02.382a1.875 1.875 0 002.28-.819l.923-1.597a1.875 1.875 0 00-.432-2.385l-.84-.692c-.095-.078-.159-.208-.159-.336a7.274 7.274 0 000-2.015c0-.128.064-.258.159-.336l.84-.692a1.875 1.875 0 00.432-2.385l-.923-1.597a1.875 1.875 0 00-2.28-.818l-1.02.382c-.114.043-.282.031-.449-.083a7.49 7.49 0 00-.985-.57c-.183-.087-.277-.227-.297-.348l-.179-1.072a1.875 1.875 0 00-1.85-1.567h-1.843zM12 15.75a3.75 3.75 0 100-7.5 3.75 3.75 0 000 7.5z" clip-rule="evenodd" /></svg>
            </button>
        </div>
    </header>

    <main>
        <div class="glass-panel calculator-form">
            <div class="input-group">
                <label class="input-label">Initial Market Cap</label>
                <div class="input-wrapper">
                    <span class="prefix">$</span>
                    <input type="text" id="initial-mc" class="amount-input" placeholder="0" inputmode="decimal">
                    <div class="multiplier-group" id="init-toggles">
                        <button class="mul-btn active" data-val="1000">K</button>
                        <button class="mul-btn" data-val="1000000">M</button>
                        <button class="mul-btn" data-val="1000000000">B</button>
                    </div>
                </div>
            </div>
            
            <div class="input-group">
                <label class="input-label">Target Market Cap</label>
                <div class="input-wrapper">
                    <span class="prefix">$</span>
                    <input type="text" id="target-mc" class="amount-input" placeholder="0" inputmode="decimal">
                    <div class="multiplier-group" id="target-toggles">
                        <button class="mul-btn active" data-val="1000">K</button>
                        <button class="mul-btn" data-val="1000000">M</button>
                        <button class="mul-btn" data-val="1000000000">B</button>
                    </div>
                </div>
            </div>
            
            <div class="input-group" style="margin-top: 1.5rem;">
                <label class="input-label">Investment Amount</label>
                <div class="input-wrapper">
                    <span class="prefix">$</span>
                    <input type="text" id="investment" class="amount-input" value="10" inputmode="decimal">
                </div>
            </div>
        </div>

        <div class="glass-panel results-panel">
            <div class="result-grid">
                <div class="result-item full-width">
                    <div class="result-label">Final Value</div>
                    <div class="result-value" id="res-final-value">$0.00</div>
                    <div class="result-sub hidden" id="res-final-bdt">৳ 0.00</div>
                </div>
                <div class="result-item">
                    <div class="result-label">Profit / Loss</div>
                    <div class="result-value" id="res-profit">$0.00</div>
                    <div class="result-sub hidden" id="res-profit-bdt">৳ 0.00</div>
                </div>
                <div class="result-item">
                    <div class="result-label">ROI</div>
                    <div class="result-value" id="res-roi">0.00%</div>
                </div>
                <div class="result-item full-width" style="border-top: 1px solid var(--border); padding-top: 1rem;">
                    <div class="result-label">Multiplier</div>
                    <div class="result-value" id="res-multiplier" style="color: var(--accent-primary);">0.00x</div>
                </div>
            </div>
        </div>

        <div class="meta-inputs">
            <div class="input-group" style="flex:1;">
                <div class="input-wrapper">
                    <input type="text" id="token-name" class="amount-input" placeholder="Token (e.g. $SOL)">
                </div>
            </div>
            <div class="input-group" style="flex:1;">
                <div class="input-wrapper">
                    <input type="text" id="user-name" class="amount-input" placeholder="Username">
                </div>
            </div>
        </div>

        <button class="btn-primary" id="btn-generate">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M11.644 1.59a.75.75 0 01.712 0l9.75 5.25a.75.75 0 010 1.32l-9.75 5.25a.75.75 0 01-.712 0l-9.75-5.25a.75.75 0 010-1.32l9.75-5.25z" /><path d="M3.265 10.602l7.668 4.129a2.25 2.25 0 002.134 0l7.668-4.13-9.06 4.878a.75.75 0 01-.71 0l-9.06-4.877zM3.265 14.102l7.668 4.129a2.25 2.25 0 002.134 0l7.668-4.13-9.06 4.878a.75.75 0 01-.71 0l-9.06-4.877z" /></svg>
            Generate Trading Card
        </button>
    </main>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Settings</h2>
                <button class="close-btn" id="close-settings"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path fill-rule="evenodd" d="M5.47 5.47a.75.75 0 011.06 0L12 10.94l5.47-5.47a.75.75 0 111.06 1.06L13.06 12l5.47 5.47a.75.75 0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 010-1.06z" clip-rule="evenodd" /></svg></button>
            </div>
            
            <div class="input-group">
                <label class="input-label" style="margin-bottom:0.8rem;">Exchange Rate (USD to BDT)</label>
                <div class="input-wrapper">
                    <span class="prefix">৳</span>
                    <input type="number" id="setting-bdt-rate" class="amount-input" value="115" step="0.01">
                </div>
            </div>
            
            <div class="toggle-container" style="border:none;">
                <span class="toggle-label">Show BDT Conversion</span>
                <label class="switch">
                    <input type="checkbox" id="setting-show-bdt">
                    <span class="slider"></span>
                </label>
            </div>
            <p style="font-size:0.8rem; color:var(--text-secondary); margin-top:-10px; margin-bottom:10px;">
                If enabled, Trading Cards will also generate values in BDT instead of USD.
            </p>
        </div>
    </div>

    <!-- Preview Modal -->
    <div class="modal-overlay" id="preview-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Trading Card</h2>
                <button class="close-btn" id="close-preview"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path fill-rule="evenodd" d="M5.47 5.47a.75.75 0 011.06 0L12 10.94l5.47-5.47a.75.75 0 111.06 1.06L13.06 12l5.47 5.47a.75.75 0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 010-1.06z" clip-rule="evenodd" /></svg></button>
            </div>
            
            <div class="preview-container">
                <div class="loading-spinner" id="preview-loading"></div>
                <img id="preview-img" class="preview-image" alt="Generated Card">
            </div>
            
            <div style="display:flex; gap: 0.8rem;">
                <button class="btn-primary" id="btn-download" style="flex:2;">
                    Download High-Res
                </button>
                <button class="btn-primary" id="btn-reroll" style="flex:1; background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border); box-shadow: none;">
                    Reroll
                </button>
            </div>
        </div>
    </div>

    <div id="render-node-container"><div id="card-node" class="card-node"></div></div>

    <script>
        // Storage Helper
        const Storage = {
            get: (key, def) => {
                const val = localStorage.getItem('mccalc_' + key);
                return val !== null ? JSON.parse(val) : def;
            },
            set: (key, val) => {
                localStorage.setItem('mccalc_' + key, JSON.stringify(val));
            }
        };

        // State
        const State = {
            initVal: 0,
            initMul: 1000,
            targetVal: 0,
            targetMul: 1000,
            inv: 10,
            
            tokenName: Storage.get('tokenName', ''),
            userName: Storage.get('userName', ''),
            
            bdtRate: Storage.get('bdtRate', 115),
            showBdt: Storage.get('showBdt', false),
            theme: Storage.get('theme', 'dark')
        };

        // DOM Elements
        const elInitMC = document.getElementById('initial-mc');
        const elTargetMC = document.getElementById('target-mc');
        const elInv = document.getElementById('investment');
        
        const elToken = document.getElementById('token-name');
        const elUser = document.getElementById('user-name');
        
        const resFinalValue = document.getElementById('res-final-value');
        const resFinalBdt = document.getElementById('res-final-bdt');
        const resProfit = document.getElementById('res-profit');
        const resProfitBdt = document.getElementById('res-profit-bdt');
        const resRoi = document.getElementById('res-roi');
        const resMultiplier = document.getElementById('res-multiplier');

        // Init inputs
        elToken.value = State.tokenName;
        elUser.value = State.userName;

        const formatNumber = (num, maxFrac=2) => {
            if (isNaN(num) || num === 0) return '0.00';
            return num.toLocaleString('en-US', { maximumFractionDigits: maxFrac });
        };
        const parseAmount = (str) => parseFloat(str.replace(/,/g, '')) || 0;

        const calculate = () => {
            State.initVal = parseAmount(elInitMC.value);
            State.targetVal = parseAmount(elTargetMC.value);
            State.inv = parseAmount(elInv.value);

            let realInit = State.initVal * State.initMul;
            let realTarget = State.targetVal * State.targetMul;

            if (realInit > 0 && State.inv > 0 && realTarget > 0) {
                let multiplier = realTarget / realInit;
                let finalValue = State.inv * multiplier;
                let profit = finalValue - State.inv;
                let roi = (profit / State.inv) * 100;

                resFinalValue.innerText = `$${formatNumber(finalValue)}`;
                resProfit.innerText = `$${formatNumber(profit)}`;
                resRoi.innerText = `${formatNumber(roi)}%`;
                resMultiplier.innerText = `${formatNumber(multiplier)}x`;

                resProfit.className = 'result-value ' + (profit >= 0 ? 'value-green' : 'value-red');
                resRoi.className = 'result-value ' + (roi >= 0 ? 'value-green' : 'value-red');
                
                if(State.showBdt) {
                    resFinalBdt.innerText = `৳ ${formatNumber(finalValue * State.bdtRate)}`;
                    resFinalBdt.classList.remove('hidden');
                    resProfitBdt.innerText = `৳ ${formatNumber(profit * State.bdtRate)}`;
                    resProfitBdt.classList.remove('hidden');
                    resProfitBdt.style.color = profit >= 0 ? 'var(--success)' : 'var(--danger)';
                } else {
                    resFinalBdt.classList.add('hidden');
                    resProfitBdt.classList.add('hidden');
                }
            } else {
                resFinalValue.innerText = '$0.00';
                resProfit.innerText = '$0.00';
                resRoi.innerText = '0.00%';
                resMultiplier.innerText = '0.00x';
                resProfit.className = 'result-value';
                resRoi.className = 'result-value';
                resFinalBdt.classList.add('hidden');
                resProfitBdt.classList.add('hidden');
            }
        };

        // Handlers
        const handleInput = () => calculate();
        const handleBlur = (e) => {
            let val = parseAmount(e.target.value);
            if(val > 0) e.target.value = formatNumber(val, 4); // Allow up to 4 decimals for precision
        };
        const handleFocus = (e) => {
            let val = parseAmount(e.target.value);
            if(val > 0) e.target.value = val;
        };

        [elInitMC, elTargetMC, elInv].forEach(el => {
            el.addEventListener('input', handleInput);
            el.addEventListener('blur', handleBlur);
            el.addEventListener('focus', handleFocus);
        });
        
        elToken.addEventListener('input', e => { State.tokenName = e.target.value; Storage.set('tokenName', State.tokenName); });
        elUser.addEventListener('input', e => { State.userName = e.target.value; Storage.set('userName', State.userName); });

        // Toggles logic
        const setupToggles = (groupId, stateKey) => {
            const btns = document.querySelectorAll(`#${groupId} .mul-btn`);
            btns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    btns.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    State[stateKey] = parseFloat(e.target.getAttribute('data-val'));
                    calculate();
                });
            });
        };
        setupToggles('init-toggles', 'initMul');
        setupToggles('target-toggles', 'targetMul');

        // Modals & Settings
        const settingsOverlay = document.getElementById('settings-overlay');
        const previewOverlay = document.getElementById('preview-overlay');
        
        document.getElementById('settings-btn').addEventListener('click', () => {
            document.getElementById('setting-bdt-rate').value = State.bdtRate;
            document.getElementById('setting-show-bdt').checked = State.showBdt;
            settingsOverlay.classList.add('active');
        });
        
        document.getElementById('close-settings').addEventListener('click', () => {
            settingsOverlay.classList.remove('active');
        });

        document.getElementById('setting-bdt-rate').addEventListener('input', (e) => {
            State.bdtRate = parseFloat(e.target.value) || 0;
            Storage.set('bdtRate', State.bdtRate);
            calculate();
        });

        document.getElementById('setting-show-bdt').addEventListener('change', (e) => {
            State.showBdt = e.target.checked;
            Storage.set('showBdt', State.showBdt);
            calculate();
        });

        // Theme Toggle (Default is dark)
        const setTheme = (theme) => {
            document.documentElement.setAttribute('data-theme', theme);
            State.theme = theme;
            Storage.set('theme', theme);
        };
        document.getElementById('theme-toggle').addEventListener('click', () => {
            setTheme(State.theme === 'dark' ? 'light' : 'dark');
        });
        setTheme(State.theme);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(()=>{});
            });
        }
        
        // ============================================================
        // CARD ENGINE v2 — Complete Redesign
        // 11 Independent Design Subsystems | Hundreds of Unique Cards
        // ============================================================
        class CardEngine {
            constructor(data) {
                this.d = data;
                this.isProfit = data.profit >= 0;
                this.m = data.multiplier;
                this.node = document.getElementById('card-node');
                this.tier = this._getTier();
                this.emotion = this._getEmotion();
            }

            _getTier() {
                const m = this.m;
                if (!this.isProfit) return m < 0.5 ? 'heavy_loss' : 'loss';
                if (m >= 100) return 'ultra';
                if (m >= 50)  return 'legendary';
                if (m >= 10)  return 'moon';
                if (m >= 3)   return 'large';
                if (m >= 1.5) return 'medium';
                return 'small';
            }

            _getEmotion() {
                return { ultra:'ultra', legendary:'legendary', moon:'dominant',
                         large:'excited', medium:'happy', small:'satisfied',
                         loss:'disappointed', heavy_loss:'broken' }[this.tier];
            }

            pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

            fmt(val, rate) {
                rate = rate || 1;
                const v = val * rate;
                if (v >= 1e9) return (v/1e9).toFixed(2) + 'B';
                if (v >= 1e6) return (v/1e6).toFixed(2) + 'M';
                if (v >= 1e3) return (v/1e3).toFixed(2) + 'K';
                return v.toLocaleString('en-US', {maximumFractionDigits:2});
            }

            // ─────────────────────────────────────────────────────
            // SUBSYSTEM 1 — COLOR PSYCHOLOGY  (15 full palette sets)
            // ─────────────────────────────────────────────────────
            _palette() {
                const P = [
                    // Ultra / Legendary
                    { id:'divine_gold',      bg:'#0a0600', card:'#140c00', text:'#fff', ac:'#FFD700', ac2:'#FFA500', sub:'#7a5500', glow:'rgba(255,215,0,0.45)',   tiers:['ultra','legendary'] },
                    { id:'cosmic_platinum',  bg:'#04040f', card:'#0b0b1e', text:'#eeeeff', ac:'#C0C0FF', ac2:'#8080FF', sub:'#5050aa', glow:'rgba(192,192,255,0.4)', tiers:['ultra','legendary','moon'] },
                    { id:'fire_legend',      bg:'#0f0000', card:'#1e0500', text:'#fff', ac:'#FF6B00', ac2:'#FF2200', sub:'#8b2200', glow:'rgba(255,107,0,0.5)',    tiers:['ultra','legendary'] },
                    { id:'aurora_supreme',   bg:'#000b08', card:'#001410', text:'#fff', ac:'#00FFB3', ac2:'#00C4FF', sub:'#007766', glow:'rgba(0,255,179,0.4)',    tiers:['ultra','legendary','moon'] },
                    // Moon / Large
                    { id:'emerald_surge',    bg:'#001408', card:'#002010', text:'#fff', ac:'#00E576', ac2:'#00C45E', sub:'#005533', glow:'rgba(0,229,118,0.35)',   tiers:['moon','large','medium'] },
                    { id:'electric_blue',    bg:'#000614', card:'#000c24', text:'#ddf0ff', ac:'#00AAFF', ac2:'#0055FF', sub:'#002d99', glow:'rgba(0,170,255,0.35)', tiers:['moon','large'] },
                    { id:'violet_ascent',    bg:'#06000f', card:'#0e001e', text:'#eedeff', ac:'#B366FF', ac2:'#7B2FFF', sub:'#4a00bb', glow:'rgba(179,102,255,0.4)', tiers:['moon','large','medium'] },
                    { id:'neon_matrix',      bg:'#000800', card:'#001000', text:'#ddffee', ac:'#00FF41', ac2:'#00CC33', sub:'#006600', glow:'rgba(0,255,65,0.35)',  tiers:['moon','large'] },
                    { id:'solar_flare',      bg:'#0f0700', card:'#1a0e00', text:'#fff', ac:'#FF8800', ac2:'#FF3300', sub:'#882200', glow:'rgba(255,136,0,0.4)',    tiers:['moon','large'] },
                    // Medium / Small
                    { id:'rose_gold',        bg:'#110707', card:'#1c0e0e', text:'#fff', ac:'#FF88A0', ac2:'#FF4477', sub:'#bb2255', glow:'rgba(255,68,119,0.35)', tiers:['large','medium','small'] },
                    { id:'arctic_white',     bg:'#030c18', card:'#071220', text:'#fff', ac:'#80E8FF', ac2:'#40BBFF', sub:'#007aaa', glow:'rgba(128,232,255,0.3)', tiers:['medium','small','large'] },
                    { id:'sakura',           bg:'#10080f', card:'#1c0c1c', text:'#ffe8f5', ac:'#FF77BB', ac2:'#FF3399', sub:'#990055', glow:'rgba(255,51,153,0.3)', tiers:['small','medium'] },
                    { id:'cyber_teal',       bg:'#001010', card:'#001c1c', text:'#dfffff', ac:'#00FFCC', ac2:'#00BBAA', sub:'#006655', glow:'rgba(0,255,204,0.3)', tiers:['small','medium','large'] },
                    { id:'amber_flame',      bg:'#0f0700', card:'#1a0f00', text:'#fff', ac:'#FFB800', ac2:'#FF8800', sub:'#996600', glow:'rgba(255,184,0,0.4)',    tiers:['medium','large'] },
                    { id:'royal_purple',     bg:'#060010', card:'#0e0018', text:'#eedfff', ac:'#9966FF', ac2:'#6633CC', sub:'#3a1199', glow:'rgba(153,102,255,0.35)', tiers:['medium','small'] },
                    // Loss
                    { id:'crimson_fall',     bg:'#100000', card:'#1c0000', text:'#fff', ac:'#FF3333', ac2:'#CC0000', sub:'#770000', glow:'rgba(255,51,51,0.4)',    tiers:['loss','heavy_loss'] },
                    { id:'grey_ashes',       bg:'#080808', card:'#101010', text:'#ccc', ac:'#888888', ac2:'#555555', sub:'#2a2a2a', glow:'rgba(136,136,136,0.3)', tiers:['loss','heavy_loss'] },
                    { id:'void_purple',      bg:'#050008', card:'#090010', text:'#ccbbee', ac:'#6633AA', ac2:'#441188', sub:'#1c0044', glow:'rgba(102,51,170,0.3)', tiers:['loss','heavy_loss'] },
                    { id:'midnight_crash',   bg:'#000810', card:'#000f1e', text:'#aac0d8', ac:'#3355AA', ac2:'#223388', sub:'#0d1a55', glow:'rgba(51,85,170,0.3)', tiers:['loss','heavy_loss'] },
                ];
                const avail = P.filter(p => p.tiers.includes(this.tier));
                return this.pick(avail.length ? avail : P);
            }

            // ─────────────────────────────────────────────────────
            // SUBSYSTEM 2 — BACKGROUND ENVIRONMENTS  (8 SVG families)
            // ─────────────────────────────────────────────────────
            _background(pal) {
                const envMap = {
                    divine_gold:'desert_dunes', fire_legend:'volcanic', amber_flame:'desert_dunes',
                    neon_matrix:'cyberpunk_grid', cyber_teal:'cyberpunk_grid',
                    crimson_fall:'volcanic', grey_ashes:'deep_space', void_purple:'deep_space', midnight_crash:'underwater',
                    aurora_supreme:'arctic', arctic_white:'arctic',
                    emerald_surge:'forest_glow', sakura:'forest_glow',
                };
                const all = ['deep_space','cyberpunk_grid','abstract_geo','volcanic','arctic','desert_dunes','underwater','forest_glow'];
                const env = envMap[pal.id] || this.pick(all);
                const W=1600, H=900, ac=pal.ac, ac2=pal.ac2, bg=pal.bg;
                let s = '';

                if (env === 'deep_space') {
                    let stars='';
                    for(let i=0;i<130;i++){const x=(Math.random()*W).toFixed(1),y=(Math.random()*H).toFixed(1),r=(Math.random()*1.6+0.3).toFixed(1),o=(Math.random()*0.7+0.2).toFixed(2);stars+=`<circle cx="${x}" cy="${y}" r="${r}" fill="white" opacity="${o}"/>`;}
                    s=`<rect w="${W}" h="${H}" width="${W}" height="${H}" fill="${bg}"/>
                    <defs><radialGradient id="nb1" cx="72%" cy="28%" r="50%"><stop offset="0%" stop-color="${ac}" stop-opacity="0.14"/><stop offset="100%" stop-color="transparent" stop-opacity="0"/></radialGradient>
                    <radialGradient id="nb2" cx="18%" cy="75%" r="40%"><stop offset="0%" stop-color="${ac2}" stop-opacity="0.1"/><stop offset="100%" stop-color="transparent" stop-opacity="0"/></radialGradient></defs>
                    <rect width="${W}" height="${H}" fill="url(#nb1)"/><rect width="${W}" height="${H}" fill="url(#nb2)"/>
                    ${stars}
                    <ellipse cx="${W*0.75}" cy="${H*0.25}" rx="160" ry="160" fill="${ac}10" stroke="${ac}" stroke-width="1" stroke-opacity="0.12"/>`;
                } else if (env === 'cyberpunk_grid') {
                    let hl='',vl='';
                    for(let y=0;y<H;y+=55)hl+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="${ac}" stroke-opacity="0.07" stroke-width="1"/>`;
                    for(let x=0;x<W;x+=55)vl+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="${ac}" stroke-opacity="0.07" stroke-width="1"/>`;
                    s=`<rect width="${W}" height="${H}" fill="${bg}"/>
                    <defs><radialGradient id="cg1" cx="50%" cy="100%" r="65%"><stop offset="0%" stop-color="${ac}" stop-opacity="0.22"/><stop offset="100%" stop-color="transparent" stop-opacity="0"/></radialGradient>
                    <linearGradient id="cg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${bg}" stop-opacity="0.55"/><stop offset="60%" stop-color="${bg}" stop-opacity="0"/></linearGradient></defs>
                    <rect width="${W}" height="${H}" fill="url(#cg1)"/>${hl}${vl}<rect width="${W}" height="${H}" fill="url(#cg2)"/>`;
                } else if (env === 'abstract_geo') {
                    let circles='';
                    for(let i=0;i<7;i++){const cx=(Math.random()*W).toFixed(),cy=(Math.random()*H).toFixed(),r=(Math.random()*180+60).toFixed(),op=(Math.random()*0.1+0.04).toFixed(2),sw=(Math.random()*2.5+0.8).toFixed(1);circles+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${i%2?ac:ac2}" stroke-opacity="${op}" stroke-width="${sw}"/>`;}
                    s=`<rect width="${W}" height="${H}" fill="${bg}"/>
                    <defs><radialGradient id="ag1" cx="80%" cy="20%" r="55%"><stop offset="0%" stop-color="${ac}" stop-opacity="0.13"/><stop offset="100%" stop-color="transparent" stop-opacity="0"/></radialGradient></defs>
                    <rect width="${W}" height="${H}" fill="url(#ag1)"/>
                    <polygon points="${W/2},-120 ${W+250},${H*0.85} -250,${H*0.85}" fill="${ac}" fill-opacity="0.025"/>
                    ${circles}`;
                } else if (env === 'volcanic') {
                    let embers='';
                    for(let i=0;i<20;i++){const x=(Math.random()*W).toFixed(),y=(Math.random()*H).toFixed(),r=(Math.random()*4+1).toFixed(1),op=(Math.random()*0.5+0.1).toFixed(2);embers+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#FF5500" opacity="${op}"/>`;}
                    s=`<rect width="${W}" height="${H}" fill="#080000"/>
                    <defs><radialGradient id="lv1" cx="50%" cy="100%" r="60%"><stop offset="0%" stop-color="#FF5500" stop-opacity="0.55"/><stop offset="65%" stop-color="#8B0000" stop-opacity="0.18"/><stop offset="100%" stop-color="transparent" stop-opacity="0"/></radialGradient>
                    <radialGradient id="lv2" cx="15%" cy="85%" r="32%"><stop offset="0%" stop-color="#FF8800" stop-opacity="0.35"/><stop offset="100%" stop-color="transparent" stop-opacity="0"/></radialGradient></defs>
                    <rect width="${W}" height="${H}" fill="url(#lv1)"/><rect width="${W}" height="${H}" fill="url(#lv2)"/>
                    <path d="M0,${H} Q220,${H*0.58} 440,${H} Q660,${H*0.62} 880,${H} Q1100,${H*0.56} 1320,${H} Q1460,${H*0.65} ${W},${H}" fill="#FF440018"/>
                    ${embers}`;
                } else if (env === 'arctic') {
                    s=`<defs><linearGradient id="ar1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#000c18"/><stop offset="100%" stop-color="#001428"/></linearGradient>
                    <radialGradient id="ar2" cx="50%" cy="38%" r="70%"><stop offset="0%" stop-color="${ac}" stop-opacity="0.17"/><stop offset="55%" stop-color="${ac2}" stop-opacity="0.07"/><stop offset="100%" stop-color="transparent" stop-opacity="0"/></radialGradient></defs>
                    <rect width="${W}" height="${H}" fill="url(#ar1)"/><rect width="${W}" height="${H}" fill="url(#ar2)"/>
                    <path d="M0,${H*0.72} Q420,${H*0.58} 860,${H*0.68} Q1240,${H*0.52} ${W},${H*0.62} L${W},${H} L0,${H} Z" fill="rgba(210,235,255,0.06)"/>
                    <path d="M0,${H*0.82} Q360,${H*0.7} 720,${H*0.78} Q1080,${H*0.66} ${W},${H*0.74} L${W},${H} L0,${H} Z" fill="rgba(210,235,255,0.04)"/>`;
                } else if (env === 'desert_dunes') {
                    s=`<defs><linearGradient id="ds1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#080400"/><stop offset="60%" stop-color="#140a00"/><stop offset="100%" stop-color="#1e1000"/></linearGradient>
                    <radialGradient id="ds2" cx="72%" cy="22%" r="22%"><stop offset="0%" stop-color="${ac}" stop-opacity="0.45"/><stop offset="100%" stop-color="transparent" stop-opacity="0"/></radialGradient></defs>
                    <rect width="${W}" height="${H}" fill="url(#ds1)"/><rect width="${W}" height="${H}" fill="url(#ds2)"/>
                    <path d="M0,${H*0.68} Q${W*0.28},${H*0.48} ${W*0.52},${H*0.64} Q${W*0.76},${H*0.78} ${W},${H*0.58} L${W},${H} L0,${H} Z" fill="${ac}0e"/>
                    <path d="M0,${H*0.78} Q${W*0.32},${H*0.6} ${W*0.62},${H*0.74} Q${W*0.82},${H*0.84} ${W},${H*0.7} L${W},${H} L0,${H} Z" fill="${ac}09"/>`;
                } else if (env === 'underwater') {
                    let bub='';
                    for(let i=0;i<22;i++){const x=(Math.random()*W).toFixed(),y=(Math.random()*H).toFixed(),r=(Math.random()*9+2).toFixed(1),op=(Math.random()*0.18+0.04).toFixed(2);bub+=`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${ac}" stroke-opacity="${op}" stroke-width="1.5"/>`;}
                    s=`<defs><linearGradient id="uw1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#000820"/><stop offset="100%" stop-color="#001040"/></linearGradient>
                    <radialGradient id="uw2" cx="62%" cy="38%" r="52%"><stop offset="0%" stop-color="${ac}" stop-opacity="0.13"/><stop offset="100%" stop-color="transparent" stop-opacity="0"/></radialGradient></defs>
                    <rect width="${W}" height="${H}" fill="url(#uw1)"/><rect width="${W}" height="${H}" fill="url(#uw2)"/>${bub}`;
                } else { // forest_glow
                    s=`<defs><linearGradient id="fg1" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0%" stop-color="#000900"/><stop offset="100%" stop-color="#001300"/></linearGradient>
                    <radialGradient id="fg2" cx="50%" cy="60%" r="55%"><stop offset="0%" stop-color="${ac}" stop-opacity="0.16"/><stop offset="100%" stop-color="transparent" stop-opacity="0"/></radialGradient></defs>
                    <rect width="${W}" height="${H}" fill="url(#fg1)"/><rect width="${W}" height="${H}" fill="url(#fg2)"/>
                    <path d="M0,${H} Q110,${H*0.38} 230,${H*0.66} Q340,${H*0.28} 480,${H*0.54} Q560,${H*0.18} 660,${H*0.48} L660,${H} Z" fill="${ac}1a"/>
                    <path d="M${W},${H} Q${W-110},${H*0.38} ${W-230},${H*0.66} Q${W-340},${H*0.28} ${W-480},${H*0.54} L${W-480},${H} Z" fill="${ac}12"/>`;
                }
                return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;">${s}</svg>`;

            // ─────────────────────────────────────────────────────

            // ─────────────────────────────────────────────────────
            // SUBSYSTEM 4 — TYPOGRAPHY SYSTEMS  (5 families)

                return this.pick([
                    { name:'mono_terminal', tok:"'Roboto Mono',monospace", num:"'Roboto Mono',monospace", body:"'Inter',sans-serif",       tokW:700, tokT:'0.06em', tokTx:'uppercase', numW:700, numT:'0.04em', lbl:'// ', lblU:true  },

                ]);

            // ─────────────────────────────────────────────────────
            // SUBSYSTEM 5 — LAYOUT SYSTEMS  (9 distinct archetypes)
            // ─────────────────────────────────────────────────────
            _layout() {
                const epic = ['ultra','legendary'].includes(this.tier);
                if (epic) return this.pick(['trophy_pedestal','backdrop_hero','full_char_bg','poster_mode']);
                if (!this.isProfit) return this.pick(['data_terminal','magazine_spread','corner_char','cinematic_split']);
                return this.pick(['cinematic_split','backdrop_hero','diagonal_cut','poster_mode','command_center','data_terminal','magazine_spread','trophy_pedestal','corner_char']);
            }

            // ─────────────────────────────────────────────────────
            // SUBSYSTEM 6 — BADGE SYSTEMS
            // ─────────────────────────────────────────────────────
            _badge(pal, typ) {
                if (!this.isProfit) return '';
                const map = {
                    ultra:    { txt:'⬡ 100X ULTRA LEGEND', bg:pal.ac,  col:'#000' },
                    legendary:{ txt:'✦ LEGENDARY 50X+',    bg:pal.ac,  col:'#000' },
                    moon:     { txt:'◈ MOON SHOT',          bg:pal.ac,  col:'#000' },
                    large:    { txt:'▲ STRONG RUN',         bg:pal.ac2, col:'#fff' },
                    medium:   { txt:'↑ SOLID GAIN',         bg:pal.ac2+'88',col:pal.text },
                    small:    { txt:'· PROFITABLE',          bg:pal.ac2+'44',col:pal.ac  },
                };
                const b = map[this.tier]; if(!b) return '';
                return `<div style="display:inline-flex;align-items:center;padding:10px 28px;background:${b.bg};color:${b.col};border-radius:50px;font-size:22px;font-weight:800;font-family:${typ.tok};letter-spacing:3px;white-space:nowrap;box-shadow:0 0 28px ${pal.glow};">${b.txt}</div>`;

            // ─────────────────────────────────────────────────────
            // SUBSYSTEM 7 — DECORATION OVERLAY
            // ─────────────────────────────────────────────────────
            _decoration(pal) {
                const W=1600,H=900,ac=pal.ac;
                const type = this.pick(['particles','circuit','hex','none','none']);
                let s='';
                if (type==='particles'){for(let i=0;i<28;i++){const x=(Math.random()*W).toFixed(),y=(Math.random()*H).toFixed(),r=(Math.random()*3+1).toFixed(1),o=(Math.random()*0.38+0.08).toFixed(2);s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${ac}" opacity="${o}"/>`;}
                } else if(type==='circuit'){for(let i=0;i<9;i++){const y=(i*105)+30,w=Math.random()*220+80,x=Math.random()*(W-w);s+=`<line x1="${x.toFixed()}" y1="${y}" x2="${(x+w).toFixed()}" y2="${y}" stroke="${ac}" stroke-width="1" opacity="0.14"/><circle cx="${(x+w).toFixed()}" cy="${y}" r="3" fill="${ac}" opacity="0.18"/>`;}} 
                else if(type==='hex'){for(let i=0;i<11;i++){const cx=Math.random()*W,cy=Math.random()*H,r=Math.random()*32+14;const pts=[];for(let a=0;a<6;a++)pts.push(`${(cx+r*Math.cos(a*Math.PI/3)).toFixed(1)},${(cy+r*Math.sin(a*Math.PI/3)).toFixed(1)}`);s+=`<polygon points="${pts.join(' ')}" fill="none" stroke="${ac}" stroke-width="1" opacity="0.11"/>`;}}
                if(!s) return '';
                return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" style="position:absolute;top:0;left:0;pointer-events:none;z-index:1;">${s}</svg>`;
            }

            // ─────────────────────────────────────────────────────

            _infoHTML(pal, typ, cfg) {
                const d=this.d, sym=d.showBdt?'৳':'$', rate=d.showBdt?d.bdtRate:1;

                      I=sym+this.fmt(d.inv,rate),     V=sym+this.fmt(d.finalValue,rate);

                const lsz=cfg.lsz||20, vsz=cfg.vsz||42;

                      <div style="padding:28px 68px;background:${pal.ac};display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
                        <div style="font-size:20px;font-family:${typ.body};font-weight:800;color:#000;letter-spacing:4px;text-transform:uppercase;">TRADE REPORT</div>
                        <div style="font-size:${tok.length>12?28:36}px;font-family:${typ.tok};font-weight:900;color:#000;letter-spacing:2px;text-transform:uppercase;overflow-wrap:break-word;max-width:55%;text-align:center;">${tok}</div>
                        ${usr?`<div style="font-size:20px;font-family:${typ.body};font-weight:600;color:#000;opacity:0.68;">${usr}</div>`:'<div></div>'}
                      </div>
                      <div style="display:grid;grid-template-columns:38% 62%;align-items:stretch;">
                        <div style="background:${pal.card};display:flex;align-items:center;justify-content:center;padding:35px;">
                          ${charBox(295,405,1)}
                        </div>
                        <div style="padding:46px 55px;display:flex;flex-direction:column;justify-content:center;gap:30px;">
                          <div style="border-left:5px solid ${pal.ac};padding-left:26px;">
                            ${heroNum(pStr,pStr.length>10?72:96,'')}
                            <div style="font-size:28px;font-family:${typ.body};color:${pal.text};opacity:0.55;margin-top:7px;">Net Profit</div>
                          </div>
                          <div style="display:flex;gap:44px;flex-wrap:wrap;">
                            <div><div style="font-size:16px;font-family:${typ.body};color:${pal.text};opacity:0.48;text-transform:uppercase;letter-spacing:2px;margin-bottom:5px;">ROI</div>${sub(roi,58)}</div>
                            <div><div style="font-size:16px;font-family:${typ.body};color:${pal.text};opacity:0.48;text-transform:uppercase;letter-spacing:2px;margin-bottom:5px;">Multiplier</div>${sub(mul,58)}</div>
                          </div>
                          ${badge}
                        </div>
                      </div>
                      <div style="padding:22px 68px;background:${pal.card};display:grid;grid-template-columns:repeat(4,1fr);gap:18px;border-top:2px solid ${pal.ac}3a;">
                        ${[['Entry MC',ent],['Exit MC',ext],['Investment',inv],['Current Value',fin,pc]].map(([l,v,c])=>`<div><div style="font-size:15px;color:${pal.text};opacity:0.48;text-transform:uppercase;letter-spacing:2px;">${l}</div><div style="font-size:29px;font-family:${typ.num};font-weight:700;color:${c||pal.text};overflow-wrap:break-word;">${v}</div></div>`).join('')}
                      </div>
                    </div>`;

                // ── LAYOUT: trophy_pedestal ──
                } else if(layout==='trophy_pedestal'){
                    inner=`<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:680px;height:680px;border-radius:50%;background:radial-gradient(circle,${pal.glow} 0%,transparent 72%);pointer-events:none;z-index:1;"></div>
                    ${glow1}
                    <div style="position:relative;z-index:2;width:100%;height:100%;padding:48px 68px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;">
                      <div style="width:100%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:18px;">
                        ${tokEl('max-width:60%;')}
                        <div style="text-align:right;">${badge}${usr?`<div style="font-size:27px;font-family:${typ.body};font-weight:600;color:${pal.text};opacity:0.65;margin-top:10px;">${usr}</div>`:''}</div>
                      </div>
                      <div style="display:flex;align-items:flex-end;gap:72px;justify-content:center;">
                        <div style="text-align:center;">
                          ${charBox(275,380,1,'flex-shrink:0;')}
                          <div style="background:linear-gradient(135deg,${pal.ac}40,${pal.ac2}20);border:2px solid ${pal.ac}55;border-radius:10px 10px 4px 4px;padding:10px 44px;margin-top:-8px;backdrop-filter:blur(8px);">
                            <div style="font-size:20px;font-family:${typ.body};font-weight:700;color:${pal.ac};letter-spacing:3px;text-transform:uppercase;white-space:nowrap;">TRADER</div>
                          </div>
                        </div>
                        <div>
                          ${heroNum(roi,roi.length>7?102:138)}
                          ${sub(mul,48)}
                          ${sub(pStr,42)}
                        </div>
                      </div>
                      <div style="width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:22px 28px;background:rgba(0,0,0,0.42);border:1px solid ${pal.ac}1e;border-radius:18px;backdrop-filter:blur(18px);">
                        ${[['Entry MC',ent],['Exit MC',ext],['Investment',inv],['Current Value',fin,pc]].map(([l,v,c])=>`<div style="text-align:center;"><div style="font-size:14px;color:${pal.text};opacity:0.48;text-transform:uppercase;letter-spacing:2px;margin-bottom:5px;">${l}</div><div style="font-size:27px;font-family:${typ.num};font-weight:700;color:${c||pal.text};overflow-wrap:break-word;">${v}</div></div>`).join('')}
                      </div>
                    </div>`;

                // ── LAYOUT: corner_char ──
                } else if(layout==='corner_char'){
                    inner=`<div style="position:absolute;bottom:-50px;right:-35px;width:440px;height:560px;z-index:1;opacity:0.65;overflow:hidden;">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="-195 -295 390 590" style="width:100%;height:100%;filter:drop-shadow(0 0 28px ${pal.glow});">${charSVG}</svg>
                    </div>
                    ${glow1}
                    <div style="position:relative;z-index:2;width:100%;height:100%;padding:62px 78px;display:flex;flex-direction:column;justify-content:space-between;">
                      <div style="max-width:68%;">${tokEl()}${usr?`<div style="font-size:30px;font-family:${typ.body};font-weight:600;color:${pal.text};opacity:0.62;margin-top:14px;">${usr}</div>`:''}</div>
                      <div style="max-width:62%;">
                        ${heroNum(mul,mul.length>5?120:165)}
                        ${sub(roi+' ROI',55)}
                      </div>
                      <div style="max-width:68%;">
                        ${this._infoHTML(pal,typ,{v:'duo',vsz:40,lsz:17})}
                        ${badge?`<div style="margin-top:18px;">${badge}</div>`:''}
                      </div>
                    </div>`;

                // ── LAYOUT: full_char_bg (default/fallback) ──
                } else {
                    inner=`<div style="position:absolute;top:0;right:4%;width:52%;height:100%;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:1;">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="-195 -295 390 590" style="height:92%;filter:drop-shadow(0 0 45px ${pal.glow});">${charSVG}</svg>
                    </div>
                    ${glow1}${glow2}
                    <div style="position:relative;z-index:2;width:100%;height:100%;padding:62px 72px;display:flex;flex-direction:column;justify-content:space-between;">
                      <div>
                        ${tokEl('max-width:52%;')}
                        ${badge?`<div style="margin-top:20px;">${badge}</div>`:''}
                      </div>
                      <div style="max-width:50%;">
                        ${heroNum(roi,roi.length>7?112:152)}
                        ${sub(mul+' · '+pStr,48)}
                      </div>
                      <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:18px;max-width:52%;">
                        <div style="display:flex;gap:44px;flex-wrap:wrap;">
                          ${[['Entry MC',ent],['Exit MC',ext],['Investment',inv]].map(([l,v])=>`<div><div style="font-size:16px;color:${pal.text};opacity:0.48;text-transform:uppercase;letter-spacing:2px;margin-bottom:5px;">${l}</div><div style="font-size:33px;font-family:${typ.num};font-weight:700;">${v}</div></div>`).join('')}
                        </div>
                        ${usr?`<div style="font-size:30px;font-family:${typ.body};font-weight:700;color:${pal.text};opacity:0.7;background:rgba(0,0,0,0.48);border:1px solid ${pal.ac}2a;border-radius:12px;padding:14px 28px;">${usr}</div>`:''}
                      </div>
                    </div>`;
                }

                return `<div style="${base}">${bg}${dec}${inner}</div>`;
            }
        }

        let isGenerating = false;

        document.getElementById('btn-generate').addEventListener('click', async () => {
            if(isGenerating) return;
            
            let initVal = parseAmount(elInitMC.value);
            let targetVal = parseAmount(elTargetMC.value);
            let inv = parseAmount(elInv.value);
            
            let realInit = initVal * State.initMul;
            let realTarget = targetVal * State.targetMul;

            if (realInit <= 0 || inv <= 0 || realTarget <= 0) {
                alert("Please enter valid positive numbers for Initial MC, Target MC, and Investment.");
                return;
            }
            
            let multiplier = realTarget / realInit;
            let finalValue = inv * multiplier;
            let profit = finalValue - inv;
            let roi = (profit / inv) * 100;
            
            let data = {
                tokenName: State.tokenName,
                userName: State.userName,
                initMC: realInit,
                targetMC: realTarget,
                inv: inv,
                finalValue: finalValue,
                profit: profit,
                roi: roi,
                multiplier: multiplier,
                showBdt: State.showBdt,
                bdtRate: State.bdtRate
            };
            
            previewOverlay.classList.add('active');
            await generateRender(data);
        });
        
        document.getElementById('close-preview').addEventListener('click', () => {
            previewOverlay.classList.remove('active');
            document.getElementById('preview-img').classList.remove('loaded');
        });
        
        document.getElementById('btn-reroll').addEventListener('click', async () => {
            if(isGenerating) return;
            // Retain previous data from current engine if available
            if(!window.lastData) return;
            document.getElementById('preview-img').classList.remove('loaded');
            await generateRender(window.lastData);
        });
        
        async function generateRender(data) {
            isGenerating = true;
            window.lastData = data;
            const node = document.getElementById('card-node');
            const spinner = document.getElementById('preview-loading');
            const img = document.getElementById('preview-img');
            
            spinner.style.display = 'block';
            img.classList.remove('loaded');
            
            let engine = new CardEngine(data);
            node.innerHTML = engine.buildHTML();
            
            // Wait for DOM
            await new Promise(r => setTimeout(r, 100));
            
            try {
                if (typeof html2canvas === 'undefined') throw new Error("Library not loaded");
                
                const canvas = await html2canvas(node, {
                    scale: 1, // Native 1600x900 is enough
                    backgroundColor: null,
                    useCORS: true,
                    logging: false
                });
                
                img.src = canvas.toDataURL('image/png', 1.0);
                img.onload = () => {
                    img.classList.add('loaded');
                    spinner.style.display = 'none';
                    isGenerating = false;
                };
            } catch (err) {
                console.error("Render failed:", err);
                spinner.style.display = 'none';
                isGenerating = false;
                alert("Failed to render card. Please try again.");
            }
        }
        
        document.getElementById('btn-download').addEventListener('click', () => {
            const imgSrc = document.getElementById('preview-img').src;
            if (!imgSrc) return;
            const link = document.createElement('a');
            link.download = `mccalc-card-${Date.now()}.png`;
            link.href = imgSrc;
            link.click();
        });

        // Trigger initial calculation
        calculate();

    </script>
</body>
</html>
